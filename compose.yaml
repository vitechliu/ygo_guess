services:
  app:
    build: .
    init: true
    ports:
      - "${PORT:-3131}:3131"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3131
      STORAGE: mysql
      CACHE: redis
      MYSQL_URL: "mysql://ygoguess:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/ygoguess"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379"
      ADMIN_ENTRY_KEY: "${ADMIN_ENTRY_KEY:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - ./config/card-pool.json:/app/config/card-pool.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3131/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ygoguess
      MYSQL_USER: ygoguess
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -uygoguess -D ygoguess -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  mysql-data:
